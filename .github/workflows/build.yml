
name: Build Minecraft Fabric Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod JAR
        run: chmod +x ./gradlew && ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: fabric-mod-jar
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
